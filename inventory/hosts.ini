; Local WSL/Docker test inventory.
; Each container exposes SSH on a unique host port (see docker/docker-compose.yml).
; All connect to 127.0.0.1 because docker-compose publishes ports on the WSL host.

; ansible_host/ansible_port = how ANSIBLE (control node) reaches the box over SSH.
; internal_ip = how the HOSTS reach EACH OTHER (nginx->app, app->db, firewall
;   rules, haproxy backends). In Docker these differ (SSH goes through the
;   host's published ports; service traffic goes over the container network).
; In AWS both collapse to the same private IP — see hosts_aws.ini.example.

[lb]
lb1 ansible_host=127.0.0.1 ansible_port=2201 internal_ip=172.30.0.10

[web]
web1 ansible_host=127.0.0.1 ansible_port=2211 internal_ip=172.30.0.21
web2 ansible_host=127.0.0.1 ansible_port=2212 internal_ip=172.30.0.22

[app]
app1 ansible_host=127.0.0.1 ansible_port=2221 internal_ip=172.30.0.31
app2 ansible_host=127.0.0.1 ansible_port=2222 internal_ip=172.30.0.32

[db]
db1 ansible_host=127.0.0.1 ansible_port=2231 internal_ip=172.30.0.41 pg_role=primary
db2 ansible_host=127.0.0.1 ansible_port=2232 internal_ip=172.30.0.42 pg_role=replica

[webservers:children]
web

[appservers:children]
app

[databases:children]
db

[loadbalancers:children]
lb

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/swiftpay_ansible
ansible_python_interpreter=/usr/bin/python3
