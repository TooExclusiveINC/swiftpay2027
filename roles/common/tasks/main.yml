---
# Applied to every host: package baseline, ntp, unattended-upgrades, users.

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  apt:
    name:
      - curl
      - vim
      - htop
      - chrony
      - unattended-upgrades
      - apt-listchanges
      - auditd
      - apparmor
      - apparmor-utils
      - python3
      - python3-pip
      - acl
    state: present

- name: Enable chrony (time sync — important for TLS certs, logs, replication)
  service:
    name: chrony
    state: started
    enabled: true

- name: Enable unattended security upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Ensure AppArmor is enabled and enforcing
  service:
    name: apparmor
    state: started
    enabled: true

- name: Create least-privilege service group for app processes
  group:
    name: swiftpay
    state: present

- name: Set hostname to inventory name
  hostname:
    name: "{{ inventory_hostname }}"

- name: Add hostname to /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present
    unsafe_writes: true

- name: Enforce password aging policy (Lynis finding remediation)
  lineinfile:
    path: /etc/login.defs
    regexp: "^PASS_MAX_DAYS"
    line: "PASS_MAX_DAYS   90"

